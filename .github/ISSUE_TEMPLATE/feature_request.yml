name: 💡 Idea or feature request
description: Suggest something that would help people study
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: For example "I study for oral exams and there is no way to practise speaking answers".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
